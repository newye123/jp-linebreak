<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>日文排版助手 - 在线演示</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      color: white;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      font-family: "Hiragino Kaku Gothic Pro", "MS Gothic", sans-serif;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    select, button {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    select {
      border: 2px solid #e0e0e0;
      background: white;
    }

    button {
      border: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .output-area {
      min-height: 150px;
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      font-size: 16px;
      line-height: 2;
      white-space: pre-wrap;
      font-family: "Hiragino Kaku Gothic Pro", "MS Gothic", sans-serif;
    }

    .output-line {
      padding: 2px 0;
      border-bottom: 1px dashed #e0e0e0;
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      font-size: 13px;
      color: #666;
    }

    .stat-value {
      font-weight: 600;
      color: #667eea;
    }

    .demo-texts {
      margin-top: 15px;
    }

    .demo-texts button {
      padding: 8px 12px;
      font-size: 12px;
      margin-right: 8px;
      margin-bottom: 8px;
      background: #e8e8e8;
      border: none;
      border-radius: 20px;
    }

    .demo-texts button:hover {
      background: #667eea;
      color: white;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: white;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📝 日文排版助手</h1>
      <p>智能断行处理工具 - 在线演示版本</p>
    </div>

    <div class="card">
      <div class="section">
        <div class="section-title">输入文本</div>
        <textarea id="inputText" placeholder="在这里输入日文文本..."></textarea>

        <div class="demo-texts">
          <span style="font-size: 12px; color: #999;">示例文本: </span>
          <button onclick="useDemo(1)">电商产品描述</button>
          <button onclick="useDemo(2)">新闻标题</button>
          <button onclick="useDemo(3)">技术文档</button>
          <button onclick="useDemo(4)">社交媒体</button>
        </div>

        <div class="controls">
          <select id="language">
            <option value="ja">日文</option>
            <option value="en">英文</option>
            <option value="zh">中文</option>
          </select>
          <select id="lineLength">
            <option value="15">15字/行</option>
            <option value="20" selected>20字/行</option>
            <option value="25">25字/行</option>
            <option value="30">30字/行</option>
          </select>
          <button class="btn-primary" onclick="processText()">✨ 断行处理</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">断行结果</div>
        <div id="output" class="output-area">点击"断行处理"后显示结果</div>
        <div class="stats" id="stats" style="display: none;">
          <span>原文: <span class="stat-value" id="originalLen">0</span> 字</span>
          <span>行数: <span class="stat-value" id="lineCnt">0</span> 行</span>
        </div>
        <div class="controls">
          <button class="btn-secondary" onclick="copyResult()">📋 复制结果</button>
          <button class="btn-secondary" onclick="clearAll()">🗑️ 清空</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>日文排版助手 © 2024 | 浏览器插件版本即将上线</p>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000'

    const demoTexts = {
      1: '私たちの製品は、品質と革新的なデザインにおいて高い評価をいただいております。お客様満足度99%を獲得し、多くの方にご愛顧いただいております。',
      2: '東京股市大幅上漲　専門家「今後の動向に注目」',
      3: '本システムは、クラウドネイティブアーキテクチャを採用しており、スケーラビリティと可用性を最大化しています。マイクロサービス間の通信には、gRPCプロトコルを使用しています。',
      4: '昨日は友人とカフェに行きました☕️とても美味しいコーヒーでした！今日もまた行きたいなあ'
    }

    function useDemo(id) {
      document.getElementById('inputText').value = demoTexts[id]
    }

    async function processText() {
      const text = document.getElementById('inputText').value.trim()
      if (!text) {
        alert('请输入要处理的文本')
        return
      }

      const language = document.getElementById('language').value
      const maxLineLength = parseInt(document.getElementById('lineLength').value)

      try {
        const response = await fetch(`${API_BASE}/api/v1/segment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            language,
            options: { maxLineLength, preferAfterParticle: true }
          })
        })

        const result = await response.json()

        if (result.success && result.data) {
          displayResult(result.data)
        } else {
          throw new Error(result.error || '处理失败')
        }
      } catch (error) {
        console.error(error)
        alert('处理失败，请确保 API 服务已启动\n错误: ' + error.message)
      }
    }

    function displayResult(data) {
      const { lines, metadata } = data

      const output = document.getElementById('output')
      output.innerHTML = lines.map(line =>
        `<div class="output-line">${escapeHtml(line)}</div>`
      ).join('')

      document.getElementById('stats').style.display = 'flex'
      document.getElementById('originalLen').textContent = metadata.originalLength
      document.getElementById('lineCnt').textContent = metadata.lineCount
    }

    function copyResult() {
      const text = document.getElementById('output').innerText
      if (text && !text.includes('点击"断行处理"')) {
        navigator.clipboard.writeText(text).then(() => {
          alert('已复制到剪贴板')
        })
      }
    }

    function clearAll() {
      document.getElementById('inputText').value = ''
      document.getElementById('output').innerHTML = '点击"断行处理"后显示结果'
      document.getElementById('stats').style.display = 'none'
    }

    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text
      return div.innerHTML
    }
  </script>
</body>
</html>
